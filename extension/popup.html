<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      background: #0f141c;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #1d9bf0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .desc {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 0;
      text-align: center;
      background: #1d9bf0;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #1a8cd8;
    }
    .tip {
      font-size: 11px;
      color: #58a6ff;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">𝕏</div>
    <div class="title">X 互关筛查助手</div>
  </div>
  <div class="desc">
    打开 x.com 任意页面，右下角将出现「互关筛查」悬浮按钮，点击即可一键检测未回关人员。
  </div>
  <button id="openTwitterBtn" class="btn">前往 X (Twitter) 网页端</button>
  <div class="tip">✨ 纯本地运行 · 零隐私上传</div>
  <script src="popup.js"></script>
</body>
</html>
